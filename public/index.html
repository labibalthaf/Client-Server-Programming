<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoteNow · Voter</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            base: '#0F172A',
            card: '#1E293B',
            accent: '#3B82F6',
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-base text-slate-100 min-h-screen antialiased">
  <div class="max-w-xl mx-auto px-4 py-8">

    <!-- HEADER -->
    <header class="flex items-center justify-between mb-8">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-accent/20 flex items-center justify-center text-accent text-2xl">🗳️</div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight">Vote<span class="text-accent">Now</span></h1>
          <p class="text-xs text-slate-400">Voting Real-Time</p>
        </div>
      </div>

      <!-- STATUS KONEKSI -->
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-card border border-slate-700 text-sm">
        <span id="dot" class="w-2.5 h-2.5 rounded-full bg-red-500 transition-colors duration-300"></span>
        <span id="connText" class="text-slate-300">Menyambungkan…</span>
      </div>
    </header>

    <!-- KARTU UTAMA -->
    <section class="bg-card rounded-2xl shadow-lg shadow-black/20 border border-slate-700/60 p-6">

      <!-- Placeholder ketika belum ada polling -->
      <div id="emptyState" class="text-center py-12 text-slate-500">
        <div class="text-4xl mb-3">⏳</div>
        <p class="text-sm">Belum ada polling yang aktif.<br />Menunggu admin memulai polling…</p>
      </div>

      <!-- Tampilan polling -->
      <div id="pollState" class="hidden">
        <h2 id="question" class="text-xl font-semibold text-slate-100 mb-1 leading-snug"></h2>
        <p class="text-xs text-slate-400 mb-5">
          Total suara: <span id="totalVotes" class="font-semibold text-slate-200">0</span>
          <span id="closedTag" class="hidden ml-2 px-2 py-0.5 rounded-full bg-red-500/20 text-red-400">Ditutup</span>
        </p>

        <!-- Tombol opsi (mode voting) -->
        <div id="voteButtons" class="space-y-3"></div>

        <!-- Bar hasil (muncul setelah memilih / saat ditutup) -->
        <div id="resultBars" class="space-y-3 hidden"></div>

        <!-- Pesan status -->
        <div id="voterMsg" class="hidden mt-5 text-center text-sm rounded-lg py-2.5 px-4"></div>
      </div>
    </section>

    <footer class="text-center text-xs text-slate-600 mt-8">
      Labib Althaf · NIM 23343042 · Informatika UNP
    </footer>
  </div>

  <!-- Socket.IO client -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // ---- elemen DOM ----
    const dot        = document.getElementById('dot');
    const connText   = document.getElementById('connText');
    const emptyState = document.getElementById('emptyState');
    const pollState  = document.getElementById('pollState');
    const questionEl = document.getElementById('question');
    const totalVotesEl = document.getElementById('totalVotes');
    const closedTag  = document.getElementById('closedTag');
    const voteButtons = document.getElementById('voteButtons');
    const resultBars = document.getElementById('resultBars');
    const voterMsg   = document.getElementById('voterMsg');

    let currentOptions = [];
    let hasVoted = false;
    let isClosed = false;

    const barColors = [
      'bg-accent', 'bg-emerald-500', 'bg-amber-500', 'bg-pink-500', 'bg-violet-500',
      'bg-cyan-500', 'bg-orange-500', 'bg-lime-500', 'bg-rose-500', 'bg-teal-500',
    ];

    // ---- status koneksi ----
    socket.on('connect', () => {
      dot.classList.replace('bg-red-500', 'bg-green-500');
      connText.textContent = 'Terhubung';
    });
    socket.on('disconnect', () => {
      dot.classList.replace('bg-green-500', 'bg-red-500');
      connText.textContent = 'Terputus';
    });

    // ---- render tombol opsi (mode voting) ----
    function renderVoteButtons(options) {
      voteButtons.innerHTML = '';
      options.forEach((opt) => {
        const btn = document.createElement('button');
        btn.className =
          'w-full text-left rounded-lg border border-slate-600 bg-base px-4 py-3 text-sm font-medium ' +
          'hover:border-accent hover:bg-accent/10 active:scale-[.99] transition disabled:opacity-50 disabled:cursor-not-allowed';
        btn.textContent = opt;
        btn.addEventListener('click', () => socket.emit('vote', { option: opt }));
        voteButtons.appendChild(btn);
      });
    }

    // ---- render bar hasil ----
    function renderResultBars(results, total) {
      resultBars.innerHTML = '';
      currentOptions.forEach((opt, i) => {
        const count = results[opt] || 0;
        const pct = total > 0 ? Math.round((count / total) * 100) : 0;
        resultBars.insertAdjacentHTML('beforeend', `
          <div>
            <div class="flex justify-between text-sm mb-1">
              <span class="text-slate-200">${escapeHtml(opt)}</span>
              <span class="text-slate-400">${count} · ${pct}%</span>
            </div>
            <div class="w-full h-4 rounded-full bg-slate-700/70 overflow-hidden">
              <div class="h-full ${barColors[i % barColors.length]} rounded-full transition-all duration-500 ease-out"
                   style="width:${pct}%"></div>
            </div>
          </div>`);
      });
    }

    function showMessage(text, type) {
      voterMsg.textContent = text;
      voterMsg.classList.remove('hidden');
      if (type === 'success') {
        voterMsg.className = 'mt-5 text-center text-sm rounded-lg py-2.5 px-4 bg-green-500/15 text-green-400';
      } else if (type === 'closed') {
        voterMsg.className = 'mt-5 text-center text-sm rounded-lg py-2.5 px-4 bg-red-500/15 text-red-400';
      } else {
        voterMsg.className = 'mt-5 text-center text-sm rounded-lg py-2.5 px-4 bg-amber-500/15 text-amber-400';
      }
    }

    // Beralih dari mode tombol -> mode hasil
    function switchToResults() {
      voteButtons.classList.add('hidden');
      resultBars.classList.remove('hidden');
    }

    // Tampilkan polling baru (mode voting, reset state voter)
    function showPoll(question, options, freshVote = true) {
      currentOptions = options;
      questionEl.textContent = question;
      emptyState.classList.add('hidden');
      pollState.classList.remove('hidden');
      renderVoteButtons(options);

      if (freshVote) {
        hasVoted = false;
        isClosed = false;
        closedTag.classList.add('hidden');
        voteButtons.classList.remove('hidden');
        resultBars.classList.add('hidden');
        voterMsg.classList.add('hidden');
      }
    }

    function disableVoting() {
      [...voteButtons.querySelectorAll('button')].forEach((b) => (b.disabled = true));
    }

    // ---- event dari server ----

    // State awal saat connect (mendukung skenario "client baru saat polling aktif")
    socket.on('current_state', (state) => {
      if (state.poll) {
        showPoll(state.poll.question, state.poll.options, true);
        if (state.isClosed) {
          // Polling sedang ditutup -> langsung tampil hasil
          isClosed = true;
          closedTag.classList.remove('hidden');
          switchToResults();
          renderResultBars(state.poll.results, state.totalVotes);
          showMessage('Polling telah ditutup.', 'closed');
        }
        totalVotesEl.textContent = state.totalVotes;
      } else {
        emptyState.classList.remove('hidden');
        pollState.classList.add('hidden');
      }
    });

    socket.on('poll_created', ({ question, options }) => {
      showPoll(question, options, true);
      totalVotesEl.textContent = '0';
    });

    // Konfirmasi vote diterima -> kunci tombol, tampilkan hasil
    socket.on('vote_accepted', () => {
      hasVoted = true;
      disableVoting();
      switchToResults();
      showMessage('✓ Anda sudah memilih.', 'success');
    });

    // Hasil terbaru (real-time). Tampilkan bar hanya jika sudah vote / ditutup.
    socket.on('update_results', ({ results, totalVotes }) => {
      totalVotesEl.textContent = totalVotes;
      if (hasVoted || isClosed) renderResultBars(results, totalVotes);
    });

    // Server menolak karena sudah memilih
    socket.on('already_voted', ({ message }) => {
      hasVoted = true;
      disableVoting();
      switchToResults();
      showMessage('✓ ' + (message || 'Anda sudah memilih.'), 'success');
    });

    // Polling ditutup admin
    socket.on('poll_closed', () => {
      isClosed = true;
      closedTag.classList.remove('hidden');
      disableVoting();
      switchToResults();
      showMessage('Polling telah ditutup.', 'closed');
    });

    socket.on('poll_reset', () => {
      emptyState.classList.remove('hidden');
      pollState.classList.add('hidden');
      hasVoted = false;
      isClosed = false;
    });

    socket.on('error_msg', ({ message }) => showMessage('⚠ ' + message, 'warn'));

    // ---- util ----
    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }
  </script>
</body>
</html>
